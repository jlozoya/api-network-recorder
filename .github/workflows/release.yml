name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run package
      - run: bun run package:source
      - run: bun run package:installer
      - run: bun run test:installer
      - run: bun run test:native:binary
      - run: bun run test:native:browser
      - run: bun run test:browser
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $recorderVersion = $env:GITHUB_REF_NAME.Substring(1)
          $recorderAssets = @(
            "release/api-network-recorder-chrome-$recorderVersion.zip",
            "release/api-network-recorder-firefox-$recorderVersion.zip",
            "release/api-network-recorder-source-$recorderVersion.zip",
            "release/api-network-recorder-windows-x64-setup.exe",
            "release/api-network-recorder-windows-x64-setup.exe.sha256"
          )
          gh release create $env:GITHUB_REF_NAME @recorderAssets --verify-tag --generate-notes
